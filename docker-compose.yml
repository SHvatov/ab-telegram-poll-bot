services:
  valkey:
    image: valkey/valkey:8-alpine
    command: valkey-server --appendonly yes --save 60 1
    volumes:
      - ${VALKEY_DATA_DIR:-./data/valkey}:/data
    restart: unless-stopped

  poll-bot:
    image: ghcr.io/shvatov/ab-telegram-poll-bot:sha-791fcbe
    platform: linux/x86_64
    env_file:
      - .env
    environment:
      REDIS_HOST: valkey
      REDIS_PORT: 6379
    depends_on:
      - valkey
    restart: unless-stopped
