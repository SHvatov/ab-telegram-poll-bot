# ${VAR} is required (fails startup if unset); ${VAR:default} falls back to `default`.
bot:
  token: "${TELEGRAM_BOT_TOKEN}"

redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}

scheduler:
  refresh-interval-seconds: 60

data:
  # TTL for user registrations / votes stored in Redis.
  ttl-days: 7
