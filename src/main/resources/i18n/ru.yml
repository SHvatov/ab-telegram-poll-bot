# Localized user-facing strings, loaded once at startup.
# Placeholders use the {name} syntax and are substituted at render time.

welcome:
  greeting: "🎉 С днём рождения, Т-Академия! 🎂\n\nПривет! 👋 Сегодня мы празднуем день рождения Т-Академии, и по такому поводу — бот для голосования за мемы и составления тир-листов! 😎🔥\n\nВыбирай, оценивай, собирай свой тир-лист — и пусть победит самый смешной мем! 🏆"

menu:
  title: "🏠 Главное меню"
  button:
    vote: "🗳 Проголосовать за мем"
    rating: "📊 Рейтинг мемов"
    my-tier-list: "🏆 Мой тир-лист"
    global-tier-list: "🌍 Глобальный тир-лист"
    source: "💻 Исходники"
    back: "◀️ Главное меню"
    admin-winner: "🎲 Определить победителя"
    admin-stats: "📈 Статистика использования"
  source:
    text: "💻 Исходный код бота открыт — ссылка на репозиторий ниже. Загляни, там даже переписка с Клодиком есть! 😄"

vote:
  list:
    title: "🗳 Выберите мем, чтобы оценить его:"
    empty: "Пока нет доступных мемов для голосования. 🤷"
    item:
      unvoted: "[{globalRating}] {name}"
      voted: "[{globalRating}] [вы: {rating}] {name}"
  detail:
    caption: "{description}"
    already-voted: "{description}\n\nВы оценили этот мем: {rating}"
  rate:
    button:
      s: "Очень смешно! Это теперь мой самый любимый мем!"
      a: "Смешно, сохраню себе на память!"
      b: "Смешно!"
      c: "Могло бы быть смешнее..."
      f: "Вообще не смешно :("
      back: "Верните меня обратно..."
  saved-alert: "Спасибо, ваша оценка сохранена! 🙌"
  already-voted-alert: "Вы уже голосовали за этот мем! 😉"
  unavailable-alert: "Этот мем пока недоступен для голосования. ⏳"

rating:
  list:
    title: "📊 Глобальный рейтинг мемов:"
    empty: "Пока нет доступных мемов. 🤷"
    item: "[{globalRating}] {name}"
  detail:
    caption: "{description}\n\nГлобальный рейтинг: {globalRating}"
    caption-rated: "{description}\n\nГлобальный рейтинг: {globalRating}\nВаша оценка: {rating}"
  none: "нет оценок"

tier:
  caption:
    personal: "🏆 Ваш тир-лист"
    global: "🌍 Глобальный тир-лист"
  generating: "⏳ Генерирую тир-лист, это займёт пару секунд…"
  empty: "Пока нет оценённых мемов — тир-лист составить не из чего. 🤷"
  rate-limited: "⏳ Попробуйте снова через {seconds} сек."
  queue-full: "🥵 Сервис генерации сейчас перегружен, попробуйте чуть позже."
  failed: "😔 Не удалось сгенерировать тир-лист, попробуйте позже."

admin:
  winner:
    announcement: "🏆 Поздравляем! 🎉\n\nВы стали победителем конкурса «Лучший мем года» на дне рождения Т-Академии! 🎂\n\nЧтобы забрать приз 🎁, напишите Сергею — @skhvatov."
    picked-alert: "🎉 Победитель выбран и уведомлён (ИД {userId})."
    empty-alert: "🤷 Некого выбирать — пока никто не проголосовал ни за один мем."
    notify-failed-alert: "⚠️ Победитель выбран (ИД {userId}), но отправить ему сообщение не удалось."
  stats:
    title: "📈 Статистика использования"
    users: "👥 Пользователей всего: {count}"
    voters: "🗳 Проголосовали хотя бы раз: {count}"
    meme-votes-header: "📊 Голосов по мемам:"
    percentiles-header: "📈 Перцентили (мемов оценено на пользователя):"
    percentile-line: "  • p{p}: {value} мемов"
    histogram-header: "🎯 Проголосовали хотя бы за N мемов:"
    histogram-line: "  • ≥ {n}: {count} польз."
    empty: "Пока нет данных — никто не голосовал."

error:
  generic: "Что-то пошло не так, попробуйте ещё раз."
  meme-not-found: "Мем не найден."
  unknown-command: "Неизвестная команда. Пользуйтесь кнопками меню ниже."
